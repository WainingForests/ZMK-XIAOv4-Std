CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

CONFIG_ZMK_SLEEP=n

# --- ESB split transport (central) ---
# BLE stays on: dongle still talks HID to the host.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# Required by the ESB module (see its Kconfig help text)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
# ESB and the BLE host must share the radio via timeslots
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
